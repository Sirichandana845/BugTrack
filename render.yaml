# Render Blueprint for the API, PostgreSQL, persistent uploads, and web client.
# The web service, PostgreSQL instance, and persistent disk use paid plans.
databases:
  - name: bugtrack-postgres
    databaseName: bugtrack
    user: bugtrack
    plan: basic-256mb

services:
  - type: web
    name: bugtrack-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    disk:
      name: bugtrack-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bugtrack-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://bugtrack-web.onrender.com
      - key: UPLOAD_DIR
        value: /var/data/uploads

  - type: web
    name: bugtrack-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://bugtrack-api.onrender.com/api
